<!doctype html><html lang=ar dir=rtl><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>لوحة المعلم</title><link rel=stylesheet href=style.css></head>
<body><script>
window.__err=function(m){var d=document.createElement('pre');d.style.cssText='background:#fee;color:#900;padding:10px;direction:ltr;white-space:pre-wrap;margin:10px;font:13px monospace';d.textContent='ERROR: '+m;(document.body||document.documentElement).appendChild(d)};
addEventListener('error',function(e){__err((e.message||'script load failed')+' '+(e.filename||''))},true);
addEventListener('unhandledrejection',function(e){__err((e.reason&&(e.reason.code+' | '+e.reason.message))||e.reason)});
</script>
<main id=app>جارٍ التحميل…</main>
<script type=module>
import {db,auth,fs,au,$,esc,fmt,grade} from "./common.js";
const app=$("#app");let ex,keys,subs=[];
au.onAuthStateChanged(auth,u=>u?home():login());
function login(){app.innerHTML=`<h2>دخول المعلم</h2><div class=card><input id=e type=email placeholder="الإيميل"><input id=p type=password placeholder="كلمة السر"><button id=b>دخول</button></div>`;
 $("#b").onclick=()=>au.signInWithEmailAndPassword(auth,$("#e").value,$("#p").value).catch(()=>alert("بيانات غلط"))}
async function home(){const q=await fs.getDocs(fs.collection(db,"exams"));
 app.innerHTML=`<h2>الامتحانات</h2><div class=card>رفع امتحان (ملف JSON): <input type=file id=f accept=.json><button class=g id=out>خروج</button></div>`+
 q.docs.map(d=>{const x=d.data();return `<div class=card><b>${esc(x.title)}</b> <small>${x.questions.length} سؤال — ${x.active?"مفتوح":"مغلق"}</small><br>
 <button data-a=tg data-id="${d.id}">${x.active?"إغلاق":"فتح"}</button> <button data-a=sub data-id="${d.id}">النتائج والتصحيح</button> <button class=r data-a=del data-id="${d.id}">حذف</button>${links(d.id)}</div>`}).join("");
 $("#out").onclick=()=>au.signOut(auth);$("#f").onchange=upload;
 app.onclick=async e=>{const{a,id}=e.target.dataset;if(!a)return;
  if(a==="tg"){const s=await fs.getDoc(fs.doc(db,"exams",id));await fs.updateDoc(fs.doc(db,"exams",id),{active:!s.data().active});home()}
  if(a==="del"&&confirm("حذف الامتحان؟")){await fs.deleteDoc(fs.doc(db,"exams",id));await fs.deleteDoc(fs.doc(db,"examKeys",id));home()}
  if(a==="sub")subsView(id)}}
async function upload(e){try{const j=JSON.parse(await e.target.files[0].text()),id=j.id||"exam-"+Date.now(),A={},M={};
 const qs=j.questions.map((q,i)=>{const o={id:"q"+(i+1),type:q.type==="essay"?"essay":"mcq",text:q.text,marks:+q.marks||1};if(q.passage)o.passage=q.passage;
  if(q.type==="tf"){o.options=["صح","خطأ"];A[o.id]=q.answer?0:1}else if(o.type==="mcq"){o.options=q.options;A[o.id]=q.answer}else M[o.id]=q.modelAnswer||"";return o});
 const pub={title:j.title,subject:j.subject||"",durationMin:+j.durationMin||60,active:false,questions:qs,createdAt:Date.now()};
 if(j.instantResult){if(!confirm("النتيجة الفورية بتحط الإجابات الصح جوه الصفحة العامة. متأكد؟"))return;pub.answers=A;pub.model=M}
 await fs.setDoc(fs.doc(db,"exams",id),pub);await fs.setDoc(fs.doc(db,"examKeys",id),{answers:A,model:M});alert("تم الرفع (الامتحان مغلق، افتحه لما تجهز)");home()}catch(err){alert("الملف غير صالح: "+err.message)}}
const base=location.href.replace(/admin\.html.*$/,"");
const cp=(l,v)=>`<small>${l}</small><input readonly value="${v}" onclick="this.select()">`;
const links=id=>`<div>${cp("🔗 رابط الطلاب (للواتساب):",base+id+".html")}${cp("رابط مباشر احتياطي:",base+"index.html?exam="+id)}${cp("📊 رابط الدرجات:",base+"grades.html?exam="+id)}</div>`;
async function subsView(id){ex=(await fs.getDoc(fs.doc(db,"exams",id))).data();ex.id=id;keys=(await fs.getDoc(fs.doc(db,"examKeys",id))).data();
 subs=(await fs.getDocs(fs.query(fs.collection(db,"submissions"),fs.where("examId","==",id)))).docs.map(d=>({id:d.id,...d.data()}));
 const rs=subs.map(s=>grade(ex,keys,s.answers,s.essayMarks||{})),pend=rs.filter(r=>r.pend).length;
 app.innerHTML=`<h2>${esc(ex.title)} — ${subs.length} طالب</h2><button class=g id=bk>رجوع</button> <button id=es>✍️ تصحيح المقالي</button> <button id=all>نشر النتائج للطلاب</button> <button id=bd>📊 نشر لوحة الدرجات</button>
 <div class=card>${pend?`⚠️ ${pend} طالب مقاليه لسه ما اتصححش.`:"✅ كل المقالي اتصحح."}</div><div style="overflow:auto"><table><tr><th>الطالب</th><th>موضوعي</th><th>مقالي</th><th>المجموع</th><th>الزمن</th><th>خروج من الصفحة</th><th>الحالة</th><th></th></tr>`+
 subs.map((s,i)=>{const r=rs[i];return `<tr><td>${esc(s.name)}<br><small>${esc(s.cls)}</small></td><td>${r.obj}</td><td>${r.pend?"—":r.ess}</td><td>${r.score}/${r.tot} (${r.g})</td><td>${fmt(s.durationSec)}</td><td>${s.switches||0}</td><td>${s.released?"✅ منشور":"—"}</td><td><a class=btn href="${mail(s,r)}">إيميل</a></td></tr>`}).join("")+"</table></div>";
 app.onchange=null;app.onclick=null;$("#bk").onclick=home;$("#es").onclick=()=>essay(0);$("#bd").onclick=()=>board(rs);
 $("#all").onclick=async()=>{if(pend&&!confirm("في مقالي لسه ما اتصححش وهيتحسب لهم «لم تُصحح». تكمل؟"))return;for(const s of subs)await release(s);subsView(id)}}
function essay(qi){const eq=ex.questions.filter(q=>q.type==="essay"),q=eq[qi];if(!q)return alert("لا توجد أسئلة مقالية");
 const done=subs.filter(s=>s.essayMarks?.[q.id]!=null).length,opts=[];for(let m=0;m<=q.marks;m+=.5)opts.push(m);
 app.innerHTML=`<h2>تصحيح المقالي — سؤال ${qi+1} من ${eq.length}</h2><button class=g id=bk>رجوع للنتائج</button> <button id=pv ${qi?"":"disabled"}>السابق</button> <button id=nx ${qi<eq.length-1?"":"disabled"}>التالي</button>
 <div class=card><b>${esc(q.text)}</b> <small>(${q.marks} درجة)</small>${q.passage?`<details><summary>النص</summary><div style="white-space:pre-wrap">${esc(q.passage)}</div></details>`:""}</div>
 <div class=card style="border-color:#16a34a"><b>✅ الإجابة النموذجية وتوزيع الدرجات</b><div style="white-space:pre-wrap">${esc(keys.model[q.id])}</div></div><p>تم تصحيح ${done} من ${subs.length}</p>`+
 subs.map((s,i)=>{const v=s.essayMarks?.[q.id];return `<div class=card><b>${esc(s.name)}</b> <small>${esc(s.cls)}</small><div style="white-space:pre-wrap;margin:8px 0">${esc(s.answers[q.id]||"— لم يجب —")}</div>${opts.map(m=>`<button class="${v===m?"":"g"}" data-i=${i} data-m=${m}>${m}</button>`).join(" ")}</div>`}).join("");
 $("#bk").onclick=()=>subsView(ex.id);$("#pv").onclick=()=>essay(qi-1);$("#nx").onclick=()=>essay(qi+1);
 app.onclick=async e=>{const t=e.target;if(t.dataset.m===undefined)return;const s=subs[t.dataset.i];s.essayMarks={...(s.essayMarks||{}),[q.id]:+t.dataset.m};
  await fs.updateDoc(fs.doc(db,"submissions",s.id),{essayMarks:s.essayMarks});const y=scrollY;essay(qi);scrollTo(0,y)}}
async function board(rs){const rows=subs.map((s,i)=>({s,r:rs[i]})).filter(x=>!x.r.pend).sort((a,b)=>b.r.score-a.r.score||a.s.durationSec-b.s.durationSec).map(({s,r})=>({name:s.name,cls:s.cls||"",score:r.score,tot:r.tot,pct:r.pct,g:r.g,t:s.durationSec}));
 if(!confirm(`هتنشر ${rows.length} اسم ودرجة علنًا لأي حد معاه رابط الدرجات (اللي مقاليه لسه ما اتصححش مش هيظهر). متأكد؟`))return;
 await fs.setDoc(fs.doc(db,"boards",ex.id),{title:ex.title,rows,at:Date.now()});alert("تم نشر لوحة الدرجات ✅")}
async function release(s){const r=grade(ex,keys,s.answers,s.essayMarks||{});
 await fs.setDoc(fs.doc(db,"results",s.code),{name:s.name,examTitle:ex.title,score:r.score,tot:r.tot,pct:r.pct,g:r.g,durationSec:s.durationSec,d:r.d});await fs.updateDoc(fs.doc(db,"submissions",s.id),{released:true})}
const mail=(s,r)=>{const u=location.origin+location.pathname.replace("admin.html","")+"?code="+s.code;return `mailto:${s.email}?subject=${encodeURIComponent("نتيجة "+ex.title)}&body=${encodeURIComponent(`${s.name}\nالدرجة: ${r.score}/${r.tot} (${r.g})\nزمن الحل: ${fmt(s.durationSec)}\nالأخطاء والإجابات الصحيحة: ${u}`)}`};
</script></body></html>
